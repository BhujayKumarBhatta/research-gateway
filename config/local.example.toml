# Copy this to ~/.research-gateway/config.toml, never into a tracked repo file.
[service]
host = "127.0.0.1"
port = 8765

[database]
path = "~/.research-gateway/data/research_gateway.db"

[logging]
# path = "~/.research-gateway/data/logs/research-gateway.log"
level = "INFO"

[backup]
enabled = true
on_service_start = true
retention_count = 20

[runtime]
# directory = "~/.research-gateway/data/runtime"

[mcp_remote_auth]
mode = "static_bearer"
token = ""
allow_unauthenticated = false

[mcp_oauth]
enabled = false
issuer_url = ""
resource_url = ""
scope = "research-gateway"
admin_password_hash = ""
signing_secret = ""
sealing_secret = ""
# store_path = "~/.research-gateway/data/runtime/oauth.sqlite3"
access_token_minutes = 60
refresh_token_days = 30

[tunnel]
enabled = true
authtoken = ""
domain = ""
expose_ui = false
start_on_serve = false

[scopus]
enabled = true
api_key = ""
institutional_token = ""

[arxiv]
enabled = true
polite_delay_seconds = 3.0

[acl_anthology]
enabled = true
index_path = "~/.research-gateway/indexes/acl/index.json"

[ieee_xplore]
enabled = false
approval_status = "pending"
api_key = ""
query_field = "querytext"

[wos]
enabled = false
mode = "starter"
approval_status = "pending"
api_key = ""

[acm_dl]
enabled = false

[zotero]
enabled = false
api_key = ""
library_type = "user"
library_id = ""
collection_key = ""
collection_name = ""

[github]
enabled = false
token = ""
default_owner = ""
default_repository = ""
