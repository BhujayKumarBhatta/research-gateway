[project]
name = "research-gateway"
version = "0.1.0"
description = "Private multi-source research gateway with a canonical Evidence Store."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "acl-anthology>=1.3.1,<2",
    "aiosqlite>=0.21,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "httpx2>=2.10,<3",
    "mcp>=2.0,<3",
    "ngrok>=1.4,<2",
    "openpyxl>=3.1,<4",
    "pydantic>=2.11,<3",
    "typer>=0.16,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
research-gateway = "research_gateway.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<7",
    "mkdocs>=1.6,<2",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "live: requires a live external provider",
    "acceptance: deterministic end-to-end release gate",
]

[tool.coverage.run]
branch = true
source = ["research_gateway"]
omit = [
    "src/research_gateway/acceptance.py",
    "src/research_gateway/cli.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
